version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: moments-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: moments-pgbouncer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

  backend:
    build:
      context: ./backend
    container_name: moments-backend
    restart: unless-stopped
    depends_on:
      - pgbouncer
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/backups:/app/backups
    env_file:
      - .env  # Ce fichier contient APP_ENV=dev (ou prod)
    ports:
      - "8000:8000"
    environment:
      PGBOUNCER_AUTH_TYPE: plain
      ADMIN_USERS: ${POSTGRES_USER}
    labels:
      - "logging=promtail"
      - "logging.jobname=moments-backend"

  frontend:
    build:
      context: ./frontend
    container_name: moments-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  # === METRICS & TRACING STACK ===

  # Collecte des métriques
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: moments-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

  # Collecteur de traces
  tempo:
    image: grafana/tempo:2.3.0
    container_name: moments-tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"    # Tempo API
      - "4317:4317"    # OTLP gRPC (traces OpenTelemetry)  
      - "4318:4318"    # OTLP HTTP (traces OpenTelemetry)
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo

  # Gestionnaire d'alertes
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: moments-alertmanager
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'

  # Exporteur PgBouncer
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter
    container_name: moments-pgbouncer-exporter
    restart: unless-stopped
    depends_on:
      - pgbouncer
    ports:
      - "9127:9127"
    environment:
      - PGBOUNCER_EXPORTER_WEB_LISTEN_ADDRESS=0.0.0.0:9127
    command:
      - '--pgBouncer.connectionString=postgresql://${PGBOUNCER_STATS_USER}:${PGBOUNCER_STATS_PASSWORD}@pgbouncer:6432/pgbouncer?sslmode=disable'

  # === LOG COLLECTION ===
  loki:
    image: grafana/loki:3.0.0
    container_name: moments-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:3.0.0
    container_name: moments-promtail
    restart: unless-stopped
    depends_on:
      - loki
    volumes:
      # Configuration
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml

      # Application logs
      - ./backend/logs:/app/logs:ro

      # Docker logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

      # System logs
      - /var/log:/var/log:ro

      # PostgreSQL logs (si disponibles sur l'hôte)
      - /var/lib/postgresql/data/log:/var/lib/postgresql/data/log:ro

      # Logs de monitoring (créés par les autres containers)
      - /var/log/grafana:/var/log/grafana:ro
      - /var/log/loki:/var/log/loki:ro
      - /var/log/prometheus:/var/log/prometheus:ro
    command: -config.file=/etc/promtail/config.yml

  grafana:
    image: grafana/grafana:10.2.0
    container_name: moments-grafana
    restart: unless-stopped
    depends_on:
      - loki
      - tempo
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=moments2024!
      - GF_USERS_ALLOW_SIGN_UP=false

volumes:
  pgdata:
  prometheus-data:
  tempo-data:
  alertmanager-data:
  loki-data:
  grafana-data:
