<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>(Moments) Nouveau feedback reçu</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #fafafa;
            color: #333;
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 1.5rem;
            color: #222;
            margin-bottom: 1.5rem;
        }

        .info-section {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
        }

        .feedback-content {
            background-color: #e7f3ff;
            border-left: 4px solid #007bff;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 4px;
            white-space: pre-wrap;
        }

        .user-info {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.5rem 1rem;
            align-items: center;
        }

        .label {
            font-weight: bold;
            color: #6c757d;
        }

        .footer {
            font-size: 0.9rem;
            color: #777;
            margin-top: 2rem;
            text-align: center;
            border-top: 1px solid #dee2e6;
            padding-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💬 Nouveau feedback utilisateur</h1>

        <div class="info-section">
            <div class="user-info">
                <span class="label">Utilisateur :</span>
                <span>{{ user.prenom }} {{ user.nom }}</span>

                <span class="label">Composant :</span>
                <span>{{ feedback_request.composant }}</span>

                <span class="label">Date d'envoi :</span>
                <span>{{ date_envoi }}</span>

                <span class="label">ID utilisateur :</span>
                <span>{{ user.id }}</span>
            </div>
        </div>

        <div class="feedback-content">{{ feedback_request.commentaire }}</div>

        <div class="footer">
            — Feedback système (Moments)<br />
            <em>Retour utilisateur automatique</em>
        </div>
    </div>
</body>
</html>
