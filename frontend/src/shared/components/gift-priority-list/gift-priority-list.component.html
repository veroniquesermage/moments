<table class="gift-table">
  <thead>
  <tr>
    <th scope="col" class="visually-hidden">Priorité</th>
    <th scope="col">Titre du cadeau</th>
    <th scope="col">Prix unitaire (€)</th>
    <th scope="col" aria-label="Quantité">Qté</th>
  </tr>
  </thead>
  <tbody cdkDropList (cdkDropListDropped)="drop($event)">
  <tr *ngFor="let gift of gifts, let i = index"
      cdkDrag
      (click)="onRowClick(gift)"
      (keydown.enter)="onRowClick(gift)"
      (keydown.space)="onRowClick(gift)">

    <td (click)="$event.stopPropagation()" class=" col-actions" data-label="Priorité">
      <ng-container *ngIf="userIsTabbing$ | async; else dragHandle">
        <div class="priority-buttons">
          <button data-allow-tiers class="drag-handle"
                  [disabled]="i === 0"
                  (click)="changeOrder(i, 'up')"
                  (keydown.enter)="changeOrder(i, 'up'); $event.stopPropagation()"
                  (keydown.space)="changeOrder(i, 'up'); $event.stopPropagation()"
                  attr.aria-label="Monter la priorité de {{ gift.nom }}">
            ⬆️
          </button>
          <button data-allow-tiers class="drag-handle"
                  [disabled]="i === gifts.length - 1"
                  (click)="changeOrder(i, 'down')"
                  (keydown.enter)="changeOrder(i, 'down'); $event.stopPropagation()"
                  (keydown.space)="changeOrder(i, 'down'); $event.stopPropagation()"
                  attr.aria-label="Descendre la priorité de {{ gift.nom }}">
            ⬇️
          </button>
        </div>
      </ng-container>
      <ng-template #dragHandle>
        <button data-allow-tiers
                class="drag-handle"
                cdkDragHandle
                attr.aria-label="Changer la priorité de {{ gift.nom }}">
          ↕️
        </button>
      </ng-template>
    </td>
    <td tabindex="0" data-label="Nom">{{ gift.nom }}</td>
    <td data-label="Prix unitaire (€)">{{ gift.prix | formatMontant}}</td>
    <td data-label="Qté">{{ gift.quantite }}</td>
  </tr>
  </tbody>
</table>

<button data-allow-tiers *ngIf="hasOrderChanged" (click)="recPriorities()"> Valider les priorités</button>

<app-terminal-modal
  *ngIf="errorService.errorMessage()"
  [message]="errorService.errorMessage()!"
  [actions]="[{ label: 'Ok', eventName: 'CLOSE', style: 'danger' }]"
  (actionClicked)="errorService.clearError()"
></app-terminal-modal>
