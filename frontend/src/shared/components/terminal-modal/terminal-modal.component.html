<div class="modal-overlay">
  <div
    class="modal-box terminal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    cdkTrapFocus>

    <h2 id="modal-title" class="visually-hidden">Fenêtre de confirmation</h2>

    <h3 *ngIf="title" class="modal-title">{{ title }}</h3>

    <div *ngIf="message && !title; else contentSection">
      <p [innerHTML]="message"></p>
    </div>

    <ng-template #contentSection>
      <ng-content></ng-content>
    </ng-template>

    <div class="modal-actions">
      <button data-allow-tiers
        *ngFor="let action of actions"
        (click)="actionClicked.emit(action.eventName)"
        [ngClass]="action.style || 'primary'"
        #focusBtn>
        {{ action.label }}
      </button>
    </div>
  </div>
</div>
