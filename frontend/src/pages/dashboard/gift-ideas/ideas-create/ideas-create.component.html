<div class="form-container">
  <section class="intro-section" aria-labelledby="Introduction pour la page d'ajout d'une idée de cadeau">
    <h1 class="dashboard-title">
      ➕ Ajout d'une idée de cadeau
    </h1>
    <p class="emphase-douce">
      Partagez ici vos lumineuses inspirations pour les autres membres — car les meilleures idées méritent d'être cultivées.
    </p>
  </section>

  <app-gift-idea-form
    [giftIdeasResponse] = "undefined"
    [membersGroup] = "membersSignal()"
    (formSubmitted) = "onSubmit($event)"
    (cancel) = "router.navigate(['/dashboard/idees'])"
  ></app-gift-idea-form>


  <app-terminal-modal
    *ngIf="showModal"
    [message]="message"
    [actions]="modalActions"
    (actionClicked)="handleClicked($event)">
  </app-terminal-modal>
</div>
<app-feedback-test
  [composant]="composant">
</app-feedback-test>
