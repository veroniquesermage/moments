<div class="block">
  <hr class="block-separator" />
  <div class="block-title">🧏🏻 Mon compte </div>
  <hr class="block-separator" />

  <div *ngIf="user; else loading">
    <p> Prénom : {{user.prenom}}</p>
    <p> Nom : {{user.nom}}</p>
    <p *ngIf="user.hasPassword"> Email : {{user.email}}</p>

    <div class="options">
      <button (click)="disconnect()">Déconnexion</button>
      <button *ngIf="user.hasPassword" (click)="changePassword()">Changer mon mot de passe</button>
    </div>
  </div>

  <ng-template #loading>
    <p>Chargement...</p>
  </ng-template>
</div>
