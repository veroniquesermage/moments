<!DOCTYPE html>
<html>
<head>
    <title>Test PersistenceService</title>
</head>
<body>
    <h1>Test PersistenceService MINIMALISTE</h1>
    <div id="results"></div>

    <script>
        // Simulation basique du service pour test manuel
        class PersistenceService {
            constructor() {
                this.LOCAL_PREFIX = 'app_kdo';
                this.SESSION_PREFIX = 'nav_state';
            }

            savePersistent(key, value) {
                const fullKey = `${this.LOCAL_PREFIX}.${key}`;
                localStorage.setItem(fullKey, JSON.stringify(value));
            }

            getPersistent(key) {
                const fullKey = `${this.LOCAL_PREFIX}.${key}`;
                const stored = localStorage.getItem(fullKey);
                return stored ? JSON.parse(stored) : null;
            }

            saveNavigationState(componentKey, state) {
                const fullKey = `${this.SESSION_PREFIX}.${componentKey}`;
                sessionStorage.setItem(fullKey, JSON.stringify({
                    data: state,
                    timestamp: Date.now()
                }));
            }

            getNavigationState(componentKey, maxAge = 30 * 60 * 1000) {
                const fullKey = `${this.SESSION_PREFIX}.${componentKey}`;
                const stored = sessionStorage.getItem(fullKey);

                if (!stored) return null;

                const parsed = JSON.parse(stored);
                const age = Date.now() - parsed.timestamp;

                if (age > maxAge) {
                    sessionStorage.removeItem(fullKey);
                    return null;
                }

                return parsed.data;
            }

            clearAllPersistent() {
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith(`${this.LOCAL_PREFIX}.`)) {
                        keysToRemove.push(key);
                    }
                }
                keysToRemove.forEach(key => localStorage.removeItem(key));
            }
        }

        // Tests
        function runTests() {
            const service = new PersistenceService();
            const results = document.getElementById('results');
            let allTestsPassed = true;

            function test(name, fn) {
                try {
                    fn();
                    results.innerHTML += `<p style="color: green;">✅ ${name}</p>`;
                } catch (error) {
                    results.innerHTML += `<p style="color: red;">❌ ${name}: ${error.message}</p>`;
                    allTestsPassed = false;
                }
            }

            // Nettoyer avant les tests
            localStorage.clear();
            sessionStorage.clear();

            // Test 1: Données persistantes
            test('Save/Get Persistent Data', () => {
                service.savePersistent('testKey', { name: 'test', value: 123 });
                const retrieved = service.getPersistent('testKey');
                if (!retrieved || retrieved.name !== 'test' || retrieved.value !== 123) {
                    throw new Error('Data not saved/retrieved correctly');
                }
            });

            // Test 2: GroupId
            test('Active Group ID', () => {
                service.savePersistent('activeGroupId', 42);
                const groupId = service.getPersistent('activeGroupId');
                if (groupId !== 42) {
                    throw new Error('GroupId not saved correctly');
                }
            });

            // Test 3: Navigation State
            test('Navigation State', () => {
                const state = {
                    currentPage: 3,
                    pageSize: 25,
                    filters: { status: 'active' }
                };
                service.saveNavigationState('test-component', state);
                const retrieved = service.getNavigationState('test-component');
                if (!retrieved || retrieved.currentPage !== 3) {
                    throw new Error('Navigation state not saved correctly');
                }
            });

            // Test 4: TTL (Time To Live)
            test('Navigation State TTL', () => {
                service.saveNavigationState('ttl-test', { data: 'test' });
                const expired = service.getNavigationState('ttl-test', 0); // maxAge = 0
                if (expired !== null) {
                    throw new Error('TTL not working correctly');
                }
            });

            // Test 5: Cleanup
            test('Clear All Persistent', () => {
                service.savePersistent('key1', 'value1');
                service.savePersistent('key2', 'value2');
                service.clearAllPersistent();

                if (service.getPersistent('key1') !== null || service.getPersistent('key2') !== null) {
                    throw new Error('Cleanup not working correctly');
                }
            });

            // Test 6: Préfixes (éviter les conflits)
            test('Prefix Isolation', () => {
                localStorage.setItem('other_app.data', 'should not be touched');
                service.savePersistent('our_data', 'our value');
                service.clearAllPersistent();

                if (localStorage.getItem('other_app.data') !== 'should not be touched') {
                    throw new Error('Prefix isolation not working');
                }
                if (service.getPersistent('our_data') !== null) {
                    throw new Error('Our data not cleaned');
                }
            });

            // Résultat final
            if (allTestsPassed) {
                results.innerHTML += '<h2 style="color: green;">🎉 Tous les tests passent ! PersistenceService fonctionne correctement.</h2>';
            } else {
                results.innerHTML += '<h2 style="color: red;">❌ Certains tests ont échoué.</h2>';
            }

            // Afficher ce qui est dans les storages
            results.innerHTML += '<h3>État des storages :</h3>';
            results.innerHTML += `<p>localStorage: ${localStorage.length} items</p>`;
            results.innerHTML += `<p>sessionStorage: ${sessionStorage.length} items</p>`;
        }

        // Lancer les tests au chargement
        runTests();
    </script>
</body>
</html>
