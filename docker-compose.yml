version: '3.8'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    container_name: moments-postgres
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: moments-pgbouncer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    environment:
      PGBOUNCER_AUTH_TYPE: plain
      ADMIN_USERS: moments

  backend:
    build:
      context: ./backend
    container_name: moments-backend
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/backups:/app/backups
    env_file:
      - .env  # Ce fichier contient APP_ENV=dev (ou prod)
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: moments-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata: